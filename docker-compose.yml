version: '3.8'

services:
  signalrapi:
    build:
      context: ./SignalRApi
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=SignalRDb;User Id=sa;Password=YourStrong(!)Password;TrustServerCertificate=True;"

  signalrwebui:
    build:
      context: ./SignalRWebUI
      dockerfile: Dockerfile
    ports:
      - "5001:80"
    depends_on:
      - signalrapi
    environment:
      ASPNETCORE_URLS: http://+:80
      ApiSettings__BaseUrl: "http://signalrapi"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "YourStrong(!)Password"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data: